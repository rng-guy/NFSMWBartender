; ── ■ │ ROADBLOCK BEHAVIOUR │ ■ ──────────────────────────────────────────────────────────────────

[Roadblocks:Recycling]
; Whether the game may recycle distant cop vehicles to create roadblocks.
;
; ■ FORMAT: heatXY = mayRecycleCops (FREE-ROAM; "default" if omitted)
;           raceXY = mayRecycleCops (RACES;     "default" if omitted)
;
; • Through recycling, both "Chasers" and Strategy vehicles may appear in roadblocks.
; • In the worst case, disabling recycling delays roadblocks by a few seconds.
; • The game tends to only recycle vehicles in the beginning of each pursuit.
; • Each value must be either "true" or "false".
; • You can define a "default" value.

