[Joining:Fleeing]
; Delay interval (in seconds) and "Chasers" threshold for joined roadblock cops to flee.
;
; ■ FORMAT: heatXY = {min, max}FleeDelay, chasersThreshold (FREE-ROAM)
;           raceXY = {min, max}FleeDelay, chasersThreshold (RACES)
;
; • Joined cops flee only at Heat levels for which you define valid delay and threshold values.
; • Joined cops flee only while the number of active "Chasers" is above the threshold.
; • Delays are random values between "minFleeDelay" and "maxFleeDelay" (inclusive).
; • Each delay value     must be a non-negative decimal or whole number.
; • Each threshold value must be a non-negative whole number.
; • You can't define a "default" value tuple.

