; ── ■ │ CUSTOM ROADBLOCK SETUPS │ ■ ──────────────────────────────────────────────────────────────
;
; BEFORE YOU CHANGE OR ADD any roadblock setups, you should first understand how
; Bartender decides which roadblock setup to spawn following a roadblock request:
;  1) • the game picks a spawn location and calculates the appropriate road width,
;  2) • Bartender removes all setups that don't match the requested spike-strip setting,
;  3) • Bartender removes all setups whose min. road width is >  the spawn location's width,
;  4) • Bartender removes all setups whose max. road width is <= the spawn location's width,
;  5) • Bartender chooses a random setup from those remaining through a "chance"-weighted roll,
;  6) • Bartender returns either the standard or mirrored version of the chosen setup, and
;  7) • the game re-scales (i.e. stretches) the returned setup by up to 14% if there's room.
;
; TO ADD a new roadblock setup to the game:
;  1) • design your setup with Bartender's "RoadblockEditor.html" file in any browser,
;  2) • copy the contents of the "Bartender settings" field below the roadblock preview,
;  3) • think of a unique name (e.g. "MySpikes01") for your new roadblock setup,
;  4) • create a new parameter group called "[Setups:MySpikes01]" in this .ini file,
;  5) • paste the roadblock settings from the editor into this new parameter group,
;  6) • (optional) adjust the upper "extent" width value to control possible spawn locations,
;  7) • (optional) define a "stretch" flag value to toggle coverage-based width stretching,
;  8) • (optional) define a "mirror" probability value to control mirrored setup spawns, and
;  9) • (optional) define (relative) "heatXY" / "raceXY" chance values to adjust the spawn rate.
;
; The OPTIONAL "CHANCE" VALUES for roadblock setups are weights, not percentages. They work
; just like the "chance" values the game uses for cop spawns: The actual probability of a given
; setup being selected is its "chance" value divided by the sum of the "chance" values of all
; roadblocks that (also) fulfil the requirements for the game's current roadblock request.
; A "chance" value of 0 means the roadblock setup never appears at that Heat level.

[Setups:Example]
; Settings (widths and offsets in metres) for the custom "Example" roadblock setup.
;
; ■ FORMAT: extent = {min, max}RoadWidth
;
;           partXY = typeID, {horizontal, vertical}Offset, orientation
;
;           stretch = isEnabled
;           mirror  = probability
;
;           heatXY = chance (FREE-ROAM; "default" if omitted)
;           raceXY = chance (RACES;     "default" if omitted)
; 
; • Bartender ignores setups without valid "extent" values or at least one car.
; • If you don't define a width-stretching flag,           Bartender uses "true".
; • If you don't define a mirror probability (in percent), Bartender uses 0.
; • If you don't define a "default" spawn-chance value,    Bartender uses 100.
; • Each type ID                must be either 0 (none), 1 (car), 2 (sawhorse), or 3 (spikes).
; • Each width                  must be a non-negative decimal or whole number.
; • Each offset and orientation must be a decimal or whole number.
; • The width-stretching flag   must be either "true" or "false".
; • The mirror probability      must be a decimal or whole number between 0 and 100 (inclusive).
; • Each spawn-chance value     must be a non-negative whole number.
; • You can define a "default" spawn-chance value.

; Uncomment the extent and part values to enable this example setup
; extent = 19.55, 22.00

; part01 = 1,  2.99, -0.14, 0.306
