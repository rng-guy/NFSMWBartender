; ── ■ │ COP TAGGING │ ■ ──────────────────────────────────────────────────────────────────────────

[Speedbreaker:Tagging]
; How much Speedbreaker charge (in seconds) you gain / lose from tagging any cop vehicle.
;
; ■ FORMAT: heatXY = chargeChange (FREE-ROAM; "default" if omitted)
;           raceXY = chargeChange (RACES;     "default" if omitted)
;
; • These charge changes are on top of the "[Tagging:Vehicles]" settings below.
; • You can only tag each cop vehicle once, much like the "cops damaged" statistic in-game.
; • A cop vehicle counts as tagged regardless of whether you actually caused the collision.
; • Bartender always respects the Speedbreaker's hard-coded charge limits.
; • Negative values make tagging any cop vehicle decrease your charge instead.
; • Each value must be a decimal or whole number.
; • You can define a "default" value.

