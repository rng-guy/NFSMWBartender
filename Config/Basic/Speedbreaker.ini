; ── ■ │ GAINS / LOSSES │ ■ ───────────────────────────────────────────────────────────────────────

[Speedbreaker:Active]
; Whether you can gain / lose charge through actions while the Speedbreaker is active.
;
; ■ FORMAT: heatXY = can{Gain, Lose}Charge (FREE-ROAM; "default" if omitted)
;           raceXY = can{Gain, Lose}Charge (RACES;     "default" if omitted)
;
; • These filters apply to any net-positive / net-negative charge-changes you trigger.
