[Assault:Limit]
; How many times you can receive credit for assaulting a single cop vehicle.
;
; ■ FORMAT: heatXY = maxNumAssaultsPerCop (FREE-ROAM)
;           raceXY = maxNumAssaultsPerCop (RACES)
;
; • This limit affects the "[Speedbreaker:Assault]" and "[Assault:Vehicles]" settings above.
; • Assaults are only limited at Heat levels for which you define a valid limit value.
; • Bartender tracks the assault count separately for each cop vehicle that spawns.
; • Each value must be a whole number between 0 and 254 (inclusive).
; • You can't define a "default" value.

