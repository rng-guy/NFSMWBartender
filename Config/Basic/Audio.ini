; ── ■ │ COP RADIO │ ■ ────────────────────────────────────────────────────────────────────────────

[Vehicles:Callsigns]
; Which radio callsigns and chatter specific cop vehicles can trigger in your pursuits.
;
; ■ FORMAT: pvehicle = battalion ("default" if omitted)
;
; • The game assigns callsigns by grouping cop vehicles into four radio battalions.
; • The game automatically puts all helicopters into a helicopter-exclusive battalion.
; • Bartender ignores vehicles that are helicopters or don't exist in VltEd.
; • Each value must be either "patrol", "elite", "rhino", or "cross".
; • The "patrol" battalion triggers "Charlie 2", "Bravo 4-2", ...
; •     "elite"                     "X-ray   9", "X-ray  11", ...
; •     "rhino"                     "Rhino 4-1", "Rhino 5-2", ...
; •     "cross"                     "X-ray" and Cross' lines.
; • You can define a "default" value.

; Omitted cop vehicles
default = patrol

; Regular patrols
copmidsize  = patrol
copghost    = patrol
copgto      = patrol
copgtoghost = patrol

; Street-racing unit
copsporthench = elite
copsportghost = elite
copsport      = elite

; Heavy support
copsuv       = rhino
copsuvl      = rhino
copsuvpatrol = rhino

; Sergeant Cross
copcross = cross




[Heat:Jurisdiction]
; Which pursuit jurisdiction dispatch announces over radio.
;
; ■ FORMAT: heatXY = jurisdiction (FREE-ROAM; "default" if omitted)
;           raceXY = jurisdiction (RACES;     "default" if omitted)
;
; • Whether dispatch makes a jurisdiction announcement is also subject to random chance.
; • With vanilla VltEd settings, these announcements have a cooldown of 1000 seconds.
; • The "anytimeevents_dispjurishift" VltEd node controls these announcements.
; • The "city" jurisdiction doesn't trigger a radio announcement.
; • Each value must be either "city", "state", or "federal".
; • You can define a "default" value.

default = city

heat01 = city
heat02 = city
heat03 = state
heat04 = state
heat05 = federal
heat06 = federal
heat07 = federal
heat08 = federal
heat09 = federal
heat10 = federal

race01 = city
race02 = city
race03 = state
race04 = state
race05 = federal
race06 = federal
race07 = federal
race08 = federal
race09 = federal
race10 = federal






; ── ■ │ PURSUIT MUSIC │ ■ ────────────────────────────────────────────────────────────────────────

[Music:Playlist]
; The selection and order of interactive themes that play during your pursuits.
;
; ■ FORMAT: trackXY = pursuitTheme
;
; • There are four pursuit themes in the game: "theme1", "theme2", "theme3", and "theme4".
; • You can define a playlist of arbitrary length using these four themes (with duplicates).
; • By default, Bartender loops through this playlist from top to bottom in each pursuit.
; • You can customise how Bartender uses this playlist (see "[Playlist:Settings]" below).
; • If you don't define any valid tracks, Bartender disables all its playlist features.
; • Bartender ignores interactive themes that don't exist in the game.
; • Each value must be either "theme1", "theme2", "theme3", or "theme4".
; • You can't define a "default" value.

track01 = theme1
track02 = theme2
track03 = theme3
track04 = theme4
; track05 = ...
; ...




[Playlist:Settings]
; The shuffle settings and length per track (in seconds) for the pursuit-theme playlist.
;
; ■ FORMAT: shuffleFirstTrack = isEnabled
;           shuffleAfterFirst = isEnabled
;
;           lengthPerTrack = value
;
; • Bartender can shuffle the first track that plays in each pursuit.
; • Bartender can shuffle the tracks that play after the first in each pursuit.
; • These settings have no effect without a valid playlist (see "[Music:Playlist]" above).
; • If you don't define any shuffle settings, Bartender shuffles the first track in each pursuit.
; • If you don't define a track length, the first track in each pursuit keeps playing forever.
; • Each shuffle setting must be either "true" or "false".
; • The track length     must be a non-negative decimal or whole number.
; • You can't define a "default" value.

shuffleFirstTrack = true
shuffleAfterFirst = false

lengthPerTrack = 600.0