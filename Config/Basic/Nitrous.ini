; ── ■ │ PASSIVE NITROUS │ ■ ──────────────────────────────────────────────────────────────────────

[Nitrous:Time]
; Whether your NOS can recharge passively over time in active pursuits.
;
; ■ FORMAT: heatXY = passiveRechargeEnabled (FREE-ROAM; "default" if omitted)
;           raceXY = passiveRechargeEnabled (RACES;     "default" if omitted)
;
; • Each value must be either "true" or "false".
; • You can define a "default" value.

