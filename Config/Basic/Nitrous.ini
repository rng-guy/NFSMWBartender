[Tagging:Vehicles]
; How much NOS charge (in seconds) you gain / lose from tagging specific cop vehicles.
;
; ■ FORMAT: pvehicle = chargeChange ("default" if omitted)
;
; • These charge changes are on top of the "[Nitrous:Tagging]" settings above.
; • You can only tag each cop vehicle once, much like the "cops damaged" statistic in-game.
; • A cop vehicle counts as tagged regardless of whether you actually caused the collision.
; • Bartender always respects the charge limits of any installed NOS upgrades.
; • Negative values make tagging specific cop vehicles decrease your charge instead.
; • Each value must be a decimal or whole number.
; • You can define a "default" value.

; Cop vehicles without explicit charge changes (uncomment to enable)
; default = 0.0

; Regular patrol cars (uncomment to enable)
; copmidsize  = 0.0
; copghost    = 0.0
; copgto      = 0.0
; copgtoghost = 0.0

; Elite street-racing unit (uncomment to enable)
; copsporthench = 0.0
; copsportghost = 0.0
; copsport      = 0.0

; Heavy support units (uncomment to enable)
; copsuv       = 0.0
; copsuvl      = 0.0
; copsuvpatrol = 0.0

; Sergeant Cross (uncomment to enable)
; copcross = 0.0

; Helicopter (uncomment to enable)
; copheli = 0.0






