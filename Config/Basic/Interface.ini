; ── ■ │ (MINI-)MAP │ ■ ───────────────────────────────────────────────────────────────────────────

[Vehicles:Detection]
; Under which conditions specific cop vehicles can show up on the radar / mini-map.
;
; ■ FORMAT: pvehicle = radarRange, {patrol, pursuit}IconRange, keepsIcon ("default" if omitted)
;
; • "radarRange"       defines the distance below which a cop triggers the cop radar.
; • "patrolIconRange"  defines the distance (in metres) below which a patrol  cop gets an icon.
; • "pursuitIconRange" defines the distance (in metres) below which a pursuit cop gets an icon.
; • "keepsIcon"        defines whether a cop keeps its icon if it ever goes out of range again.
; • Regardless of your settings, the game only draws the mini-map icons of up to 8 cops.
; • Bartender ignores vehicles that are helicopters or don't exist in VltEd.
; • Each range value   must be a non-negative decimal or whole number.
; • Each keeping value must be either "true" or "false".
; • You can define a "default" value tuple.

; Omitted cop vehicles
; default = 300.0, 0.0, 300.0, true

; Undercover cops (completely hidden)
; copghost      = 0.0, 0.0, 0.0, false
; copgtoghost   = 0.0, 0.0, 0.0, false
; copsportghost = 0.0, 0.0, 0.0, false




[Helicopter:Vision]
; Colour of the helicopter's cone-of-vision icon depending on whether it can see you.
;
; ■ FORMAT: outOfSight  = red, green, blue, alpha, transitionLength
;           withinSight = red, green, blue, alpha, transitionLength
;
; • "transitionLength" defines how long (in seconds) it takes to fully transition to the colour.
; • The "heliLOSdistance" VltEd parameter defines the visual detection range of all helicopters.
; • If you don't define valid colours for both sight states, Bartender disables this feature.
; • Each colour value     must be a whole number between 0 and 255 (inclusive).
; • Each transition value must be a non-negative decimal or whole number.
; • You can't define a "default" value tuple.

; Colours from Most Wanted's beta version
; outOfSight  = 144, 184, 255, 255, 0.2
; withinSight = 255, 174,  64, 255, 0.2