[Vehicles:Notifications]
; What notification strings the game displays whenever you destroy specific cop vehicles.
;
; ■ FORMAT: pvehicle = notificationOrGameString ("default" if omitted)
;
; • You can use the "Binary" tool by MaxHwoy to browse, edit, and expand the game's strings.
; • If the string matches              "/SKIP_NOTIFICATION", the game skips the notification.
; • If the string matches       the name of a   game string, Bartender uses the game   string.
; • If the string doesn't match the name of any game string, Bartender uses the string itself.
; • When the game displays it, "^" becomes a line break and "%$d" the bounty amount.
; • Bartender ignores vehicles that don't exist in VltEd.
; • Each value must be a string (i.e. plain text).
; • You can define a "default" value.

; Omitted cop vehicles
default = /SKIP_NOTIFICATION

; Regular patrols
copmidsize  = HUD_COPDESTROYED_COPMIDSIZE
copghost    = HUD_COPDESTROYED_COPGHOST
copgto      = HUD_COPDESTROYED_COPGTO
copgtoghost = HUD_COPDESTROYED_COPGTOGHOST

; Street-racing unit
copsporthench = HUD_COPDESTROYED_COPSPORTHENCH
copsportghost = HUD_COPDESTROYED_COPSPORTGHOST
copsport      = HUD_COPDESTROYED_COPCROSS

; Heavy support
copsuv       = HUD_COPDESTROYED_COPSUV
copsuvl      = HUD_COPDESTROYED_COPSUVL
copsuvpatrol = HUD_COPDESTROYED_COPSUV

; Sergeant Cross
copcross = HUD_COPDESTROYED_COPCROSS

; Helicopter
; copheli = Aerial Support Unit^Combo Bounty: %$d




[Notifications:Icons]
; Which notification icons the game displays whenever you destroy specific cop vehicles.
;
; ■ FORMAT: pvehicle = iconLabel ("default" if omitted)
;
; • You can use the "Binary" tool by MaxHwoy to browse, edit, and expand the game's icons.
; • If the icon label matches "/NO_ICON", the game doesn't display a notification icon.
; • Bartender ignores icons labels that don't exist in the game's "GLOBALB.LZC" file.
; • Bartender ignores vehicles     that don't exist in VltEd.
; • Each value must be a string (i.e. plain text).
; • You can define a "default" value.

; Omitted cop vehicles
