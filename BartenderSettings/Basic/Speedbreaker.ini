;
; • These charge changes are on top of the "[Speedbreaker:Collisions]" settings above.
; • To filter changes, see the "[Speedbreaker:Gains]" and "[Speedbreaker:Losses]" settings below.
; • The conditions for assault are the same as those for the "ramming a cop" infraction.
; • The game can be rather inconsistent at judging whether a collision counts as assault.
; • Bartender always respects the Speedbreaker's hard-coded charge limits.
; • Negative values make assaulting cops decrease your charge instead.
; • Each charge-change value must be a decimal or whole number.
